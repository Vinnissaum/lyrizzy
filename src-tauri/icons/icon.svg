<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#34365c" />
      <stop offset="55%" stop-color="#1c1d30" />
      <stop offset="100%" stop-color="#0f0f18" />
    </radialGradient>
  </defs>

  <!-- dark rounded-square background (brand backdrop) -->
  <rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="url(#bg)" />

  <!-- Triquetra-with-noteheads mark: one vesica-shaped lobe, stroked, instantiated
       three times at 120-degree rotations about the canvas centre so the lobes
       interlace. Each lobe terminates in a filled circular notehead at its tip. -->
  <g fill="none" stroke="#7C74F5" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(0 256 256)">
      <path d="M 256,220 A 95,95 0 0,1 256,56 A 95,95 0 0,0 256,220 Z" />
    </g>
    <g transform="rotate(120 256 256)">
      <path d="M 256,220 A 95,95 0 0,1 256,56 A 95,95 0 0,0 256,220 Z" />
    </g>
    <g transform="rotate(240 256 256)">
      <path d="M 256,220 A 95,95 0 0,1 256,56 A 95,95 0 0,0 256,220 Z" />
    </g>
  </g>

  <!-- filled noteheads at each lobe tip -->
  <g fill="#7C74F5">
    <circle transform="rotate(0 256 256)" cx="256" cy="56" r="38" />
    <circle transform="rotate(120 256 256)" cx="256" cy="56" r="38" />
    <circle transform="rotate(240 256 256)" cx="256" cy="56" r="38" />
  </g>
</svg>
