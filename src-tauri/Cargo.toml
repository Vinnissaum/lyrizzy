[package]
name = "tauri-app"
version = "1.1.0"
description = "Lyrizzy — Church Lyrics Presentation"
authors = ["vinicius.braz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["clock"] }
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Rasterizes the multi-page PDF produced by LibreOffice into one PNG per slide.
# LibreOffice's own `--convert-to png` exports only the first page, so we go
# source → PDF (LibreOffice) → per-page PNG (pdfium). Dynamically binds to a
# bundled/ system `pdfium` library at runtime; ships the `image` 0.25 interop.
pdfium-render = "0.8"
zip = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Linux-only: used to fullscreen the presentation window onto a specific monitor
# via GTK, which the Wayland/X11 compositors honor (unlike client-side
# set_position, which Wayland ignores). Version matches Tauri's bundled gtk.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Windows-only: auto-grant the microphone permission on the presentation
# WebView2 (see commands/webview_permissions.rs). These MUST match the
# webview2-com/windows that Tauri 2 pulls transitively, or `with_webview` hands
# back COM types from a different windows-core and the trait bounds don't line
# up. This Tauri uses webview2-com-sys 0.38.2 → windows-core 0.61.2; webview2-com
# is version-synced with -sys, so pin webview2-com 0.38 + windows 0.61. If a
# future Tauri bump changes these, run `cargo tree -i windows-core` and realign.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
